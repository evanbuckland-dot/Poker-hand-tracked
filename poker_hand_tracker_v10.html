<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Poker Hand Tracker</title>
<style>
:root{--bg:#0b1220;--panel:#121b2d;--panel2:#1a263d;--text:#f4f7fb;--muted:#9eabc0;--line:#2b3a55;--accent:#42d392;--danger:#ff6b6b;--gold:#f6c85f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{border:0;color:var(--text);background:var(--panel2);border-radius:12px;padding:13px 14px;font-weight:700}
button:active{transform:scale(.98)}
.wrap{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 14px calc(18px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px}
h1{font-size:21px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}
label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}
input,select{width:100%;background:#0d1627;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.primary{background:var(--accent);color:#07130e}.danger{background:#4a2028}.ghost{background:transparent;border:1px solid var(--line)}
.hidden{display:none!important}
.setupPlayers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.playerSetup{background:#0d1627;border:1px solid var(--line);border-radius:12px;padding:10px}
.playerSetup .name{font-weight:800;font-size:13px;margin-bottom:7px}
.tabs{display:flex;gap:7px;margin:8px 0}.tabs button{flex:1}.tabs .active{background:var(--accent);color:#07130e}
.table{position:relative;height:430px;margin:10px 0;background:radial-gradient(ellipse at center,#174b3b 0%,#0f392d 58%,#09251e 100%);border:7px solid #593c25;border-radius:50%/42%;box-shadow:inset 0 0 0 2px #a06b3f,0 12px 30px #0008}
.seat{position:absolute;transform:translate(-50%,-50%);width:116px;text-align:center;z-index:2}
.seat button{width:116px;padding:8px 6px;background:#172238;border:1px solid #465777;border-radius:12px;box-shadow:0 4px 10px #0007}
.seat.hero button{border:2px solid var(--gold)}
.seat .pos{font-size:10px;color:var(--muted)}.seat .nm{font-size:12px;font-weight:800}.seat .stk{font-size:13px;margin-top:2px}.streetBet{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:800;margin-top:4px;min-height:18px}.chipIcon{width:14px;height:14px;border-radius:50%;display:inline-block;background:radial-gradient(circle at center,#fff 0 22%,#d84a4a 23% 52%,#fff 53% 63%,#d84a4a 64% 100%);border:1px solid #fff;box-shadow:1px 2px 0 #8e2b2b,0 2px 4px #0008}.unknown{color:var(--muted)}
.pot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-weight:900;font-size:20px}.pot small{display:block;color:#c8d4df;font-size:10px;font-weight:600}
.s0{left:50%;top:8%}.s1{left:80%;top:23%}.s2{left:88%;top:55%}.s3{left:68%;top:88%}.s4{left:32%;top:88%}.s5{left:12%;top:55%}.s6{left:20%;top:23%}.s7{left:50%;top:92%}.s8{left:50%;top:4%}
.board{display:flex;gap:7px;justify-content:center;margin:4px 0 12px}.board input{width:48px;text-align:center;padding:9px 3px;font-weight:800}
.street{font-weight:800}.street span{color:var(--muted);font-weight:500;font-size:12px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button{padding:14px 7px}.fold{background:#4a2028}.check{background:#20334c}.call{background:#1d4a3b}.bet{background:#4b3d1b}
.log{max-height:280px;overflow:auto}.line{padding:8px 0;border-bottom:1px solid #22304a;font-size:13px}.line:last-child{border-bottom:0}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:10}.sheet{width:100%;max-width:760px;margin:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:16px calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom))}.sheet h2{font-size:18px;margin:0 0 12px}.amount{margin:10px 0}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0}.quick button{padding:10px;font-size:12px}
.status{font-size:12px;color:var(--muted);min-height:17px;margin-top:7px}
.historyItem{padding:12px 0;border-bottom:1px solid var(--line)}.historyItem b{font-size:14px}
.small{font-size:11px;color:var(--muted)}

.cards{display:flex;justify-content:center;gap:3px;margin:0 0 3px}
.playingCard{
 display:inline-flex;position:relative;flex-direction:column;align-items:center;justify-content:center;
 background:linear-gradient(145deg,#fff,#f2f3f5);color:#111;border:1px solid #c7cbd1;
 border-radius:6px;width:38px;height:51px;font-weight:900;box-shadow:0 2px 5px #0009;
 overflow:hidden;
}
.playingCard.red{color:#c62828}
.playingCard .cardRank{font-size:16px;line-height:15px}
.playingCard .cardSuit{font-size:15px;line-height:15px}
.playingCard .cardCorner{position:absolute;bottom:2px;right:3px;font-size:6px;opacity:.7;transform:rotate(180deg)}
.playingCard:after{content:"";position:absolute;inset:3px;border:1px solid #e3e5e8;border-radius:4px;pointer-events:none}
.cardback{display:inline-block;width:24px;height:30px;border-radius:4px;background:repeating-linear-gradient(45deg,#284a78 0,#284a78 2px,#d7e2ef 2px,#d7e2ef 4px);border:1px solid #fff;box-shadow:0 1px 3px #0008}
.heroCards{margin-bottom:5px;transform:scale(1.03);transform-origin:center}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>♠ Poker Hand Tracker</h1><div class="sub">Fast live-table entry</div></div><button id="resetBtn" class="ghost">New</button></header>

<section id="setup">
  <div class="card">
    <div class="grid2">
      <div><label>Game</label><input id="game" value="1/3 NLH"></div>
      <div><label>Players</label><select id="count"></select></div>
    </div>
    <div class="grid2" style="margin-top:10px">
      <div><label>Your position</label><select id="heroPos"></select></div>
      <div><label>Your starting stack</label><input id="heroStack" type="number" inputmode="decimal" value="300"></div>
    </div>
    <div class="grid2" style="margin-top:10px">
      <div><label>Rake % <span class="small">(estimate)</span></label><input id="rakePct" type="number" inputmode="decimal" value="10"></div>
      <div><label>Rake cap <span class="small">(estimate)</span></label><input id="rakeCap" type="number" inputmode="decimal" value="5"></div>
    </div>
    <div style="margin-top:10px"><label>Your hole cards</label><input id="heroCards" placeholder="Ah Ad" autocapitalize="characters"></div>
    <div class="status" id="setupStatus"></div>
  </div>
  <div class="card">
    <label>Opponent starting stacks <span class="small">(optional — you can fill these in later)</span></label>
    <div id="playersSetup" class="setupPlayers"></div>
  </div>
  <button id="startBtn" class="primary" style="width:100%;font-size:17px">Start Hand</button>
</section>

<section id="record" class="hidden">
  <div class="tabs"><button id="recordTab" class="active">Record</button><button id="historyTab">History</button></div>
  <div class="card" style="padding:10px">
    <div class="grid3">
      <div><div class="small">Hand</div><b id="handNo">1</b></div>
      <div><div class="small">Street</div><b id="streetLabel">Preflop</b></div>
      <div><div class="small">Hero</div><b id="heroStackLabel">$300</b></div>
    </div>
    <div class="grid3" style="margin-top:9px">
      <div><div class="small">Gross pot</div><b id="pot">$0</b></div>
      <div><div class="small">Est. rake</div><b id="rakeLabel">$0</b></div>
      <div><div class="small">Net pot</div><b id="netPotLabel">$0</b></div>
    </div>
  </div>
  <div class="board" id="board"></div>
  <div class="table" id="table">
    <div class="pot"><small>POT</small><span id="tablePot">$0</span></div>
  </div>
  <div class="card">
    <div class="street" id="streetTitle">Preflop <span>Tap a seat to record action</span></div>
    <div class="actions" style="margin-top:10px">
      <button class="fold" data-hero-action="fold">Fold</button>
      <button class="check" data-hero-action="check">Check</button>
      <button class="call" data-hero-action="call">Call</button>
      <button class="bet" data-hero-action="bet">Bet / Raise</button>
      <button data-hero-action="allin">All-in</button>
      <button id="nextStreet" class="primary">Next Street</button>
    </div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center"><b>Action log</b><button id="undoBtn" class="ghost" style="padding:7px 10px">Undo</button></div>
    <div id="log" class="log"></div>
  </div>
  <button id="finishBtn" class="primary" style="width:100%">Finish & Save Hand</button>
</section>

<section id="history" class="hidden">
  <div class="tabs"><button id="backRecord">Record</button><button class="active">History</button></div>
  <div class="card"><div id="historyList"></div></div>
</section>
</div>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <h2 id="modalTitle">Player action</h2>
    <div class="amount"><label>Stack behind <span class="small">(optional — enter it anytime)</span></label><div style="display:flex;gap:7px"><input id="stackEdit" type="number" inputmode="decimal" placeholder="Unknown"><button id="setStackBtn" class="ghost">Set</button></div></div>
    <div id="amountWrap" class="amount"><label id="amountLabel">Raise-to amount</label><input id="amount" type="number" inputmode="decimal" placeholder="0"><div id="callHint" class="small" style="margin-top:6px"></div></div>
    <div class="quick"><button data-q="10">$10</button><button data-q="20">$20</button><button data-q="30">$30</button><button data-q="50">$50</button><button data-q="100">$100</button><button data-q="200">$200</button></div>
    <div class="actions">
      <button class="fold" data-modal-action="fold">Fold</button>
      <button class="check" data-modal-action="check">Check</button>
      <button class="call" data-modal-action="call">Call</button>
      <button class="bet" data-modal-action="bet">Bet / Raise</button>
      <button data-modal-action="allin">All-in</button>
      <button id="cancelModal" class="ghost">Cancel</button>
    </div>
  </div>
</div>

<script>
(function(){
const POSITIONS={
2:["BTN","BB"],3:["BTN","SB","BB"],4:["BTN","SB","BB","UTG"],5:["BTN","SB","BB","UTG","CO"],
6:["BTN","SB","BB","UTG","HJ","CO"],7:["BTN","SB","BB","UTG","HJ","CO","LJ"],
8:["BTN","SB","BB","UTG","HJ","CO","LJ","MP"],9:["BTN","SB","BB","UTG","HJ","CO","LJ","MP","UTG+1"]};
let state=null, selectedPlayer=null, undoStack=[];

const $=id=>document.getElementById(id);
const money=n=>"$"+Number(n||0).toFixed(2).replace(/\.00$/,"");
const stackText=n=>n===null?"Stack ?":money(n);
const positions=()=>POSITIONS[+$("count").value];

function fillSelect(el,arr){el.innerHTML=arr.map(x=>`<option>${x}</option>`).join("")}

function setupSeats(){
 const pos=positions(), old=$("heroPos").value;
 fillSelect($("heroPos"),pos);
 $("heroPos").value=pos.includes(old)?old:pos[0];
 const wrap=$("playersSetup"); wrap.innerHTML="";
 pos.forEach(p=>{
   if(p===$("heroPos").value)return;
   const d=document.createElement("div"); d.className="playerSetup";
   d.innerHTML=`<div class="name">${p}</div><input data-opp="${p}" type="number" inputmode="decimal" placeholder="Stack (optional)">`;
   wrap.appendChild(d);
 });
}
function init(){
 fillSelect($("count"),Object.keys(POSITIONS)); $("count").value="6";
 $("rakePct").value="10"; $("rakeCap").value="5";
 setupSeats(); renderHistory();
}
$("count").addEventListener("change",setupSeats);
$("heroPos").addEventListener("change",setupSeats);

$("startBtn").addEventListener("click",start);

function blindInfo(){
 const game=($("game").value||"").toLowerCase();
 const m=game.match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);
 if(m)return {sb:Number(m[1]),bb:Number(m[2])};
 return {sb:1,bb:3};
}
function start(){
 try{
  const pos=positions(), heroPos=$("heroPos").value, blinds=blindInfo();
  const players=pos.map(p=>({
    pos:p,
    stack:p===heroPos?Number($("heroStack").value):(document.querySelector(`[data-opp="${CSS.escape(p)}"]`)?.value?Number(document.querySelector(`[data-opp="${CSS.escape(p)}"]`).value):null),
    folded:false,
    streetInvested:0,
    totalInvested:0,
    actedThisStreet:false,
    cards:p===heroPos?$("heroCards").value.trim():"",
    holeKnown:false
  }));
  state={
    game:$("game").value||"Poker", cards:$("heroCards").value.trim(), players, hero:heroPos,
    pot:0, street:"Preflop", board:[], actions:[], handNo:Number(localStorage.getItem("pokerHandNo")||0)+1,
    currentBet:blinds.bb, rakePct:Number($("rakePct").value||0), rakeCap:Number($("rakeCap").value||0),
    flopSeen:false
  };
  // Post blinds automatically.
  const sb=getPlayer("SB"), bb=getPlayer("BB");
  if(sb && sb.pos!==heroPos) postBlind(sb,blinds.sb,"SB blind");
  if(bb && bb.pos!==heroPos) postBlind(bb,blinds.bb,"BB blind");
  // If hero is a blind, still post it from hero's stack.
  if(heroPos==="SB" && sb) postBlind(sb,blinds.sb,"SB blind");
  if(heroPos==="BB" && bb) postBlind(bb,blinds.bb,"BB blind");
  // In heads-up, BTN is the small blind.
  if(pos.length===2) {
    // Heads-up: BTN posts the small blind, BB posts the big blind.
    const btn=getPlayer("BTN"), b=getPlayer("BB");
    if(btn && heroPos!=="BTN") postBlind(btn,blinds.sb,"SB blind");
    if(b && heroPos!=="BB") postBlind(b,blinds.bb,"BB blind");
    if(heroPos==="BTN" && btn) postBlind(btn,blinds.sb,"SB blind");
    if(heroPos==="BB" && b) postBlind(b,blinds.bb,"BB blind");
    state.currentBet=blinds.bb;
  }
  localStorage.setItem("pokerHandNo",state.handNo);
  undoStack=[]; showRecord(); render();
 }catch(e){$("setupStatus").textContent="Could not start: "+e.message}
}
function postBlind(p,amount,label){
 if(!p)return;
 const a=p.stack===null?amount:Math.min(amount,p.stack);
 if(p.stack!==null)p.stack-=a;
 p.streetInvested+=a;p.totalInvested+=a;state.pot+=a;
 state.actions.push({pos:p.pos,action:label,amount:a,street:"Preflop"});
}
function showRecord(){$("setup").classList.add("hidden");$("history").classList.add("hidden");$("record").classList.remove("hidden")}
function getPlayer(pos){return state.players.find(p=>p.pos===pos)}
function hero(){return getPlayer(state.hero)}

function estimatedRake(){
 if(!state) return 0;
 if(!state.flopSeen) return 0; // no-flop/no-drop assumption
 const pct=Math.max(0,state.rakePct)/100, cap=Math.max(0,state.rakeCap);
 return cap>0?Math.min(state.pot*pct,cap):state.pot*pct;
}
function render(){
 $("handNo").textContent=state.handNo;
 $("streetLabel").textContent=state.street;
 $("heroStackLabel").textContent=stackText(hero().stack);
 $("tablePot").textContent=money(state.pot); $("tablePot").textContent=money(state.pot);
 const r=estimatedRake();
 $("rakeLabel").textContent=money(r);
 $("netPotLabel").textContent=money(state.pot-r);
 $("streetTitle").innerHTML=state.street+' <span>Tap a seat to record action</span>';
 const b=$("board");b.innerHTML="";
 if(state.street!=="Preflop"){
   state.board.forEach((c,i)=>{
     const x=document.createElement("input"); x.value=c||""; x.placeholder=["F1","F2","F3","T","R"][i]; x.maxLength=3;
     x.onchange=()=>{state.board[i]=x.value.toUpperCase(); if(state.street==="Flop")state.flopSeen=true;render()};
     b.appendChild(x);
   });
 }
 const t=$("table"); t.querySelectorAll(".seat").forEach(x=>x.remove());
 state.players.forEach((p,i)=>{
   const d=document.createElement("div"); d.className="seat s"+i+(p.pos===state.hero?" hero":"");
   const cards=p.pos===state.hero && state.cards ? `<div class="cards heroCards">${formatCards(state.cards)}</div>` :
     (!p.folded ? `<div class="cards"><span class="cardback"></span><span class="cardback"></span></div>` : "");
   const streetBet=p.streetInvested>0?`<div class="streetBet"><span class="chipIcon"></span>${money(p.streetInvested)}</div>`:`<div class="streetBet"></div>`;
   d.innerHTML=`<button>${cards}<div class="pos">${p.pos}</div><div class="nm">${p.pos===state.hero?"HERO":p.folded?"FOLDED":"PLAYER"}</div><div class="stk ${p.stack===null?"unknown":""}">${stackText(p.stack)}</div>${streetBet}</button>`;
   d.querySelector("button").onclick=()=>openPlayer(p.pos);
   t.appendChild(d);
 });
 $("log").innerHTML=state.actions.map(a=>`<div class="line"><b>${a.pos}</b> — ${a.action}${a.amount?` ${money(a.amount)}`:""} <span class="small">(${a.street})</span></div>`).reverse().join("")||'<div class="small" style="padding-top:10px">No actions yet.</div>';
}
function formatCards(s){
 return s.split(/\s+/).filter(Boolean).slice(0,2).map(cardGraphic).join("");
}
function cardGraphic(c){
 const v=c.slice(0,-1).toUpperCase(), suit=c.slice(-1).toUpperCase();
 const suitMap={H:"♥",D:"♦",C:"♣",S:"♠"};
 const red=(suit==="H"||suit==="D")?" red":"";
 return `<span class="playingCard${red}"><span class="cardRank">${v}</span><span class="cardSuit">${suitMap[suit]||suit}</span><span class="cardCorner">${v}${suitMap[suit]||suit}</span></span>`;
}
function openPlayer(pos){
 selectedPlayer=pos; const p=getPlayer(pos);
 $("modalTitle").textContent=pos===state.hero?"HERO action":pos+" action";
 $("stackEdit").value=p.stack===null?"":p.stack;
 $("amount").value=""; $("amount").dataset.pending="";
 const callAmt=Math.max(0,state.currentBet-p.streetInvested);
 $("callHint").textContent=callAmt>0?`Call = ${money(callAmt)}`:"Check = $0";
 $("amount").placeholder=callAmt>0?String(callAmt):"0";
 $("modal").classList.remove("hidden");
}
function closeModal(){$("modal").classList.add("hidden");selectedPlayer=null}

function apply(pos,action,amount){
 const p=getPlayer(pos); if(!p||p.folded)return;
 if(p.actedThisStreet){
   $("callHint").textContent=`${pos} has already acted this street.`;
   return;
 }
 undoStack.push(JSON.stringify(state));
 let a=0;
 if(action==="fold"){p.folded=true}
 else if(action==="check"){ if(state.currentBet>p.streetInvested){undoStack.pop();$("callHint").textContent=`${pos} cannot check — call is ${money(state.currentBet-p.streetInvested)}.`;return;} }
 else if(action==="call"){a=Math.max(0,state.currentBet-p.streetInvested); if(p.stack!==null)a=Math.min(a,p.stack)}
 else if(action==="bet"||action==="raise"){
   const target=Number(amount||0);
   if(target<=state.currentBet){undoStack.pop();$("callHint").textContent=`Raise-to must be more than ${money(state.currentBet)}.`;return;}
   a=Math.max(0,target-p.streetInvested);
   if(p.stack!==null)a=Math.min(a,p.stack);
 }
 else if(action==="allin"){
   if(p.stack===null){undoStack.pop();$("stackEdit").focus();$("callHint").textContent="Enter this player's stack first to use All-in.";return;}
   a=p.stack;
   const newTotal=p.streetInvested+a;
   if(newTotal>state.currentBet)state.currentBet=newTotal;
 }
 if(a>0){if(p.stack!==null)p.stack-=a;p.streetInvested+=a;p.totalInvested+=a;state.pot+=a}
 p.actedThisStreet=true;
 state.actions.push({pos,action,amount:a,street:state.street});
 closeModal();render();
}
$("setStackBtn").onclick=()=>{
 const v=$("stackEdit").value.trim();
 const p=getPlayer(selectedPlayer);
 if(!p)return;
 p.stack=v===""?null:Math.max(0,Number(v));
 render();
 openPlayer(selectedPlayer);
};

document.querySelectorAll("[data-hero-action]").forEach(b=>b.onclick=()=>{
 const a=b.dataset.heroAction;
 if(a==="fold"||a==="check") return apply(state.hero,a,0);
 if(a==="call") return apply(state.hero,"call",0);
 if(a==="allin") return apply(state.hero,"allin",0);
 openPlayer(state.hero); $("amount").dataset.pending=a; setTimeout(()=>$("amount").focus(),50);
});
document.querySelectorAll("[data-modal-action]").forEach(b=>b.onclick=()=>{
 const a=b.dataset.modalAction;
 if(a==="fold"||a==="check"||a==="call") return apply(selectedPlayer,a,0);
 if(a==="allin") return apply(selectedPlayer,"allin",0);
 const v=Number($("amount").value||0);
 if(!v)return $("amount").focus();
 apply(selectedPlayer,a,v);
});
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{$("amount").value=b.dataset.q;$("amount").focus()});
$("amount").addEventListener("keydown",e=>{
 if(e.key==="Enter"){
   const a=$("amount").dataset.pending||"call";
   if(a==="call")apply(selectedPlayer,"call",0);
   else {const v=Number($("amount").value||0);if(v)apply(selectedPlayer,a,v)}
 }
});
$("cancelModal").onclick=closeModal;

$("nextStreet").onclick=()=>{
 if(state.street==="Preflop"){state.street="Flop";state.board=["","",""];state.currentBet=0;state.players.forEach(p=>{p.streetInvested=0;p.actedThisStreet=false})}
 else if(state.street==="Flop"){state.street="Turn";state.board=state.board.slice(0,3).concat("");state.currentBet=0;state.players.forEach(p=>{p.streetInvested=0;p.actedThisStreet=false})}
 else if(state.street==="Turn"){state.street="River";state.board=state.board.slice(0,4).concat("");state.currentBet=0;state.players.forEach(p=>{p.streetInvested=0;p.actedThisStreet=false})}
 else return;
 render();
};
$("undoBtn").onclick=()=>{if(undoStack.length){state=JSON.parse(undoStack.pop());render()}};

$("finishBtn").onclick=()=>{
 const hands=JSON.parse(localStorage.getItem("pokerHands")||"[]");
 hands.unshift(state);localStorage.setItem("pokerHands",JSON.stringify(hands.slice(0,200)));
 renderHistory();$("record").classList.add("hidden");$("history").classList.remove("hidden");
};
$("historyTab").onclick=()=>{$("record").classList.add("hidden");$("history").classList.remove("hidden");renderHistory()};
$("recordTab").onclick=()=>showRecord();$("backRecord").onclick=()=>showRecord();
$("resetBtn").onclick=()=>{state=null;selectedPlayer=null;$("record").classList.add("hidden");$("history").classList.add("hidden");$("setup").classList.remove("hidden");setupSeats()};
function renderHistory(){
 const h=JSON.parse(localStorage.getItem("pokerHands")||"[]");
 $("historyList").innerHTML=h.length?h.map(x=>`<div class="historyItem"><b>Hand #${x.handNo} — ${x.game}</b><div class="small">${x.cards||"No cards"} · ${x.actions.length} actions · Gross pot ${money(x.pot)} · Est. rake ${money((x.flopSeen?Math.min(x.pot*x.rakePct/100,x.rakeCap):0))}</div></div>`).join(""):'<div class="small">No saved hands yet.</div>'
}
init();
})();
</script>
</body>
</html>
